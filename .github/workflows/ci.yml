name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      SECRET_KEY: "fake-secret-key"
      DATABASE_URL: "sqlite:///fake.db"
      REDIS_URL: "redis://localhost:6379"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost"
      EMAIL_HOST_USER: "yh"
      SITE_BASE_URL: "yh"
      EMAIL_HOST_PASSWORD: "yh"
      ADMIN_SECRET: "yh"
      INTERNAL_KEY_PASSWORD: "yh"
      INTERNAL_KEY_PATH : "yh"
      INTERNAL_API_KEY : "yh"
      REDIS_1_URL : "redis://localhost:6379"
      REDIS_2_URL : "redis://localhost:6379"
      REDIS_3_URL : "redis://localhost:6379"
      REDIS_4_URL : "redis://localhost:6379"
      

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests (fast)
        run: |
          python backend/manage.py test --settings=f1_project.settings_test --keepdb --noinput
