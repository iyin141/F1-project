name: Docker images

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # No .env and no secrets: settings_test supplies safe values.
      - run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements-rag.txt   # separate step: huggingface-hub needs click>=8.4.2, requirements.txt pins 8.3.1
          pip install --no-deps fastembed==0.9.1
      - run: cd backend && python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff && cd backend && ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Build API image (linux/arm64 for Oracle A1, linux/amd64 for local)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: f1-control-room-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
