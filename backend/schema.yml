openapi: 3.0.3
info:
  title: F1 Stats Dashboard API
  version: 1.0.0
  description: F1 analytics API. Register at /api/auth/register/ to get an API key.
    Click Authorize and enter your key to test endpoints.
paths:
  /api/analysis/races/{year}/{round_number}/laps/:
    get:
      operationId: analysis_laps_retrieve
      description: Returns one row per valid lap containing the driver, lap number,
        total lap time, all three sector times, tyre compound, stint number, and a
        personal-best flag. Laps with no recorded LapTime are excluded. Supports all
        five session types (R, Q, FP1-FP3). Use the driver filter to narrow to one
        driver and limit to cap the result set.
      summary: Get lap-by-lap analysis
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, S, SQ, FP1, FP2, FP3
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapAnalysisResponse'
              examples:
                ReadinessProceed:
                  value:
                    meta:
                      year: 2020
                      round: 2
                      session: R
                      row_count: 5
                      limit_max: 2000
                      can_proceed: true
                      available_data:
                      - laps
                      - track_status
                      unavailable_data: []
                      message: null
                      warnings: []
                    filters_applied:
                      driver: null
                      limit: 5
                    data:
                    - driver_code: VER
                      lap_number: 1
                      lap_time: 0 days 00:01:37.123000
                      sector1: 0 days 00:00:31.100000
                      sector2: 0 days 00:00:33.000000
                      sector3: 0 days 00:00:33.023000
                      compound: MEDIUM
                      stint: 1
                      is_personal_best: false
                  summary: Readiness Proceed
                ReadinessPartialUnsupported:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      row_count: 0
                      limit_max: 2000
                      can_proceed: false
                      available_data:
                      - track_status
                      unavailable_data:
                      - laps
                      message: 'Session loaded, but required data is unavailable for
                        2016 Round 3 (R). Missing: laps.'
                      warnings:
                      - 'Session loaded, but required data is unavailable for 2016
                        Round 3 (R). Missing: laps.'
                    filters_applied:
                      driver: null
                      limit: 5
                    data: []
                  summary: Readiness Partial Unsupported
          description: ''
        '400':
          description: Invalid query parameters
  /api/analysis/races/{year}/{round_number}/pace/:
    get:
      operationId: analysis_pace_retrieve
      description: Aggregates lap times per driver to expose median pace, best lap,
        and consistency (standard deviation). For Race sessions the service reads
        pre-computed DriverMetric rows from the database before falling back to a
        live FastF1 computation, making it fast for recently populated seasons. Ideal
        for building a pace-comparison chart across the entire grid.
      summary: Get driver pace analysis
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code filter
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: 'R, Q, S, SQ, FP1, FP2, FP3. Default: R'
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaceAnalysisResponse'
          description: ''
        '400':
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/sector-analysis/:
    get:
      operationId: analysis_sector_retrieve
      description: For each driver returns best and median times for Sectors 1, 2,
        and 3, alongside their best actual lap and the theoretical best lap (sum of
        each sector's individual best). The delta between actual best and theoretical
        best shows how close a driver came to perfecting their lap. Race-session results
        are served from persisted SectorAggregate rows when available.
      summary: Get sector-time analysis
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code filter
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: 'R, Q, FP1, FP2, FP3. Default: R'
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorAnalysisResponse'
          description: ''
        '400':
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/stints/:
    get:
      operationId: analysis_stints_retrieve
      description: 'Groups consecutive laps on the same tyre compound into stints
        and returns per-stint statistics: compound name, start/end lap, and median/min/max
        lap time. For Race sessions the service reads pre-computed StintData rows
        from the database, bypassing a live FastF1 call entirely. Useful for visualising
        tyre degradation and strategy comparison across drivers.'
      summary: Get stint-level analysis
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code filter
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: 'R, Q, S, SQ, FP1, FP2, FP3. Default: R'
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StintAnalysisResponse'
          description: ''
        '400':
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/telemetry/:
    get:
      operationId: analysis_telemetry_retrieve
      description: 'Streams car-data samples for one specific lap of one driver: speed
        (kph), throttle percentage, brake state, RPM, gear, and distance along the
        lap. Both driver and lap are required. Use limit_points and stride to downsample
        large payloads for charting, and sector_start / sector_end to zoom into a
        specific sector window (1-3) of the lap.'
      summary: Get single-lap car telemetry
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code
        required: true
      - in: query
        name: lap
        schema:
          type: integer
        description: Lap number
        required: true
      - in: query
        name: limit_points
        schema:
          type: integer
        description: Maximum telemetry points
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: sector_end
        schema:
          type: integer
        description: Sector window end (1-3)
      - in: query
        name: sector_start
        schema:
          type: integer
        description: Sector window start (1-3)
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: query
        name: stride
        schema:
          type: integer
        description: Sample every N points
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryAnalysisResponse'
          description: ''
        '400':
          description: Missing or invalid telemetry query parameters
  /api/analysis/races/{year}/{round_number}/telemetry/overlay/:
    get:
      operationId: analysis_telemetry_overlay_retrieve
      description: Loads telemetry for driver_a and driver_b and returns separate
        traces aligned by distance so the frontend can render an overlay chart. Both
        driver codes are required; laps default to each driver's fastest lap when
        omitted. Sector windowing and downsampling work the same as the single-driver
        telemetry endpoint.
      summary: Compare telemetry of two drivers
      parameters:
      - in: query
        name: driver_a
        schema:
          type: string
        description: First 3-letter driver code
        required: true
      - in: query
        name: driver_b
        schema:
          type: string
        description: Second 3-letter driver code
        required: true
      - in: query
        name: lap_a
        schema:
          type: integer
        description: Lap number for driver_a
      - in: query
        name: lap_b
        schema:
          type: integer
        description: Lap number for driver_b
      - in: query
        name: limit_points
        schema:
          type: integer
        description: Maximum telemetry points per trace
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: sector_end
        schema:
          type: integer
        description: Sector window end (1-3)
      - in: query
        name: sector_start
        schema:
          type: integer
        description: Sector window start (1-3)
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: query
        name: stride
        schema:
          type: integer
        description: Sample every N points
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryOverlayResponse'
          description: ''
        '400':
          description: Missing or invalid telemetry overlay query parameters
  /api/analysis/races/{year}/{round_number}/telemetry/summary/:
    get:
      operationId: analysis_telemetry_summary_retrieve
      description: 'Returns high-level statistics computed from the telemetry of a
        single specified lap: maximum speed, number of braking zones detected, percentage
        of the lap spent on full throttle, and total sample count. Both driver and
        lap are required. Use sector_start / sector_end to restrict the summary to
        one part of the track.'
      summary: Get telemetry summary for a lap
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code
        required: true
      - in: query
        name: lap
        schema:
          type: integer
        description: Lap number
        required: true
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: sector_end
        schema:
          type: integer
        description: Sector window end (1-3)
      - in: query
        name: sector_start
        schema:
          type: integer
        description: Sector window start (1-3)
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: query
        name: stride
        schema:
          type: integer
        description: Sample every N points
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySummaryResponse'
          description: ''
        '400':
          description: Missing or invalid telemetry summary query parameters
  /api/analysis/races/{year}/{round_number}/tyre-strategy/:
    get:
      operationId: analysis_tyre_strategy_retrieve
      description: 'Extends the stint view with tyre-strategy-specific fields: average
        lap time per stint, median lap time, and per-lap degradation in seconds. Sourced
        from persisted StintData for Race sessions and computed live from FastF1 otherwise.
        Ideal for building tyre-strategy timeline charts that show compound changes
        and pace impact across the race.'
      summary: Get tyre strategy analysis
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code filter
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: 'R, Q, S, SQ, FP1, FP2, FP3. Default: R'
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TyreStrategyResponse'
          description: ''
        '400':
          description: Invalid parameters
  /api/auth/internal-key/:
    post:
      operationId: auth_internal_key_create
      description: |-
        POST /api/auth/{INTERNAL_KEY_PATH}/

        Generates or retrieves the internal API key for the frontend.

        Protected by:
          1. AdminEndpointThrottle — 3 attempts/hour per IP (brute-force guard)
          2. X-Admin-Password header — must match INTERNAL_KEY_PASSWORD from .env

        Store the returned key in .env as INTERNAL_API_KEY.
        Add to frontend as VITE_API_KEY or NEXT_PUBLIC_API_KEY.
        Never commit to source control.
      parameters:
      - in: header
        name: X-Admin-Password
        schema:
          type: string
        description: Admin password (INTERNAL_KEY_PASSWORD from .env)
        required: true
      tags:
      - auth
      security:
      - XAdminSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Internal key retrieved.
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Internal key created.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Invalid admin password
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: INTERNAL_KEY_PASSWORD not configured in .env
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns your tier, rate limit bucket state, and daily usage. Check
        this before making expensive telemetry requests.
      summary: Get your API key details and quota
      tags:
      - auth
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: Current key details and rate limit state
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Submit your email to receive an API key. A verification link will
        be sent to your email. Click the link to activate your key. Rate limited to
        5 attempts per hour per IP address.
      summary: Register for an API key
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterExample:
                value:
                  email: developer@example.com
                summary: Register example
        required: true
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          description: Invalid email format
        '429':
          description: Too many registration attempts (5/hour per IP)
  /api/constructors/{year}/:
    get:
      operationId: constructors_standings_retrieve
      description: Same dual-source strategy as driver standings but aggregated at
        the constructor (team) level. Returns each team's total points and wins for
        the season. Useful for building a Constructors' Championship table or a team-comparison
        view.
      summary: Get constructor championship standings
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - constructors
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructorStandingsResponse'
              examples:
                ConstructorStandingsReadiness:
                  value:
                    year: 2021
                    constructors:
                    - position: 1
                      constructor_name: Mercedes
                      points: 613.5
                      wins: 9
                    readiness:
                      can_proceed: true
                      available_data:
                      - constructor_standings_api
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Constructor Standings Readiness
          description: ''
  /api/drivers/{driver_code}/{year}/:
    get:
      operationId: drivers_retrieve
      description: 'Returns race-by-race results for one driver in a specific season:
        grid position, finish position, points, fastest lap flag, and status. The
        service queries persisted RaceResult rows first. Returns empty races with
        can_proceed=false when the season has no schedule or the driver did not compete.'
      summary: Get driver season breakdown
      parameters:
      - in: path
        name: driver_code
        schema:
          type: string
        description: 3-letter driver code (e.g. VER, HAM, LEC)
        required: true
      - in: path
        name: year
        schema:
          type: integer
        description: Season year (1950 onwards)
        required: true
      tags:
      - drivers
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSeasonResponse'
              examples:
                DriverSeasonExample:
                  value:
                    driver_code: VER
                    driver_name: Max Verstappen
                    constructor: Red Bull
                    final_position: 1
                    final_points: 575.0
                    year: 2023
                    total_races: 22
                    sprint_weekends: 6
                    races:
                    - round: 1
                      race_name: Bahrain Grand Prix
                      grid: 1
                      position: 1
                      points: 25.0
                      status: Finished
                      fastest_lap: true
                      sprint_position: null
                      sprint_points: 0
                    readiness:
                      can_proceed: true
                      available_data:
                      - season_breakdown
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Driver Season Example
          description: ''
  /api/drivers/{driver_code}/career/:
    get:
      operationId: drivers_career_retrieve
      description: 'Returns a complete career summary for a driver: all seasons with
        position, points, wins, podiums, poles, fastest laps, and DNFs. The service
        checks persisted DriverSeasonSummary rows first; for any missing seasons it
        queries Jolpica driverStandings endpoint. Returns empty career with can_proceed=false
        when neither source has data for this driver code.'
      summary: Get driver career history
      parameters:
      - in: path
        name: driver_code
        schema:
          type: string
        description: 3-letter driver code (e.g. VER, HAM, LEC)
        required: true
      tags:
      - drivers
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverCareerResponse'
              examples:
                DriverCareerExample:
                  value:
                    driver_code: VER
                    driver_name: Max Verstappen
                    nationality: Dutch
                    career:
                    - year: 2023
                      constructor: Red Bull
                      position: 1
                      points: 575.0
                      wins: 19
                      podiums: 21
                      poles: 12
                      fastest_laps: 9
                      dnfs: 0
                    career_totals:
                      total_wins: 54
                      total_podiums: 98
                      championships: 3
                    readiness:
                      can_proceed: true
                      available_data:
                      - career
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Driver Career Example
          description: ''
  /api/drivers/{year}/:
    get:
      operationId: drivers_retrieve_2
      description: Returns the current or historical F1 driver standings for a given
        year. Data is served from a persisted PostgreSQL cache if available. If the
        year is not found in the DB, the service fetches it live from Ergast/Jolpica
        and triggers an async Celery task (`populate_standings`) to persist it for
        future requests.
      summary: Get driver championship standings
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - drivers
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverStandingsResponse'
              examples:
                DriverStandingsExample:
                  value:
                    year: 2021
                    drivers:
                    - position: 1
                      driver_name: Max Verstappen
                      points: 395.5
                      wins: 10
                      constructor: Red Bull
                    readiness:
                      can_proceed: true
                      available_data:
                      - driver_standings_api
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Driver Standings Example
          description: ''
  /api/drivers/search/:
    get:
      operationId: drivers_search_retrieve
      description: Returns all drivers who competed in a given F1 season. Automatically
        syncs with Jolpica if DB is empty.
      summary: List drivers for a season
      parameters:
      - in: query
        name: year
        schema:
          type: integer
        description: F1 season year (e.g., 2025)
        required: true
      tags:
      - drivers
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/drivers/search-by-name/:
    get:
      operationId: drivers_search_by_name_retrieve
      description: Search drivers by partial name (given or family name) or driver
        code. Searches DB only — does not call Jolpica. If DB is empty, returns 503
        with hint to call /api/drivers/search/?year=<year> first. Minimum query length
        is 2 characters. Optional year filter narrows results to drivers who competed
        in that season.
      summary: Search drivers by name or code
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search query
        required: true
      - in: query
        name: year
        schema:
          type: integer
        description: Optional year filter
      tags:
      - drivers
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/races/{year}/:
    get:
      operationId: races_retrieve
      description: Returns the full calendar for a given F1 season as an ordered list
        of races. The service checks the local database first (for seasons that have
        been persisted) and falls back to a live FastF1 API call if no stored data
        is found. The round numbers in the response are the identifiers used by every
        other endpoint.
      summary: Get season race schedule
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - races
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                SeasonScheduleExample:
                  value:
                    year: 2024
                    races:
                    - round: 1
                      name: Bahrain Grand Prix
                      date: '2024-03-02'
                      location: Sakhir
                      country: Bahrain
                      event_format: standard
                      session1: FP1
                      session1_date_utc: '2024-02-29T11:30:00Z'
                      session2: FP2
                      session2_date_utc: '2024-02-29T15:00:00Z'
                      session3: FP3
                      session3_date_utc: '2024-03-01T12:30:00Z'
                      session4: Qualifying
                      session4_date_utc: '2024-03-01T16:00:00Z'
                      session5: Race
                      session5_date_utc: '2024-03-02T15:00:00Z'
                    readiness:
                      can_proceed: true
                      available_data:
                      - schedule
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Season Schedule Example
