            application/json:
              schema:
                $ref: '#/components/schemas/DRSResponse'
          description: ''
  /api/unified/races/{year}/{round_number}/full-session/:
    get:
      operationId: unified_full_session_retrieve
      description: 'Accepts a comma-separated include parameter listing any combination
        of the six available data types: weather, pit_stops, incidents, positions,
        drs, track_status. The session is loaded once and shared across all extractors,
        making this far more efficient than calling each dedicated endpoint separately.
        Partial results are fully supported — if one data type fails the others are
        still returned, and the top-level can_proceed flag reflects whether at least
        one type succeeded.'
      summary: Get multiple data types in one request
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: Optional driver filter
      - in: query
        name: include
        schema:
          type: string
        description: 'Comma-separated: weather,pit_stops,incidents,positions,drs,track_status'
        required: true
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - unified
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedFullSessionResponse'
              examples:
                UnifiedPartialSupport:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      requested_types:
                      - weather
                      - incidents
                      - positions
                      cache_stats:
                        cached_sessions: 1
                        hits: 0
                        misses: 1
                        hit_rate_percent: 0.0
                      can_proceed: true
                      available_data:
                      - positions
                      unavailable_data:
                      - weather
                      - incidents
                      message: 'Partial support for 2016 Round 3 (R). Proceeding with:
                        [''positions'']. Unavailable: [''weather'', ''incidents''].'
                      warnings:
                      - 'Partial support for 2016 Round 3 (R). Proceeding with: [''positions''].
                        Unavailable: [''weather'', ''incidents''].'
                      - 'weather: No weather data available for this session'
                      - 'incidents: No messages data available for this session'
                    data:
                      positions:
                        meta:
                          row_count: 24
                        filters_applied:
                          driver: null
                          limit: null
                        data: []
                      weather:
                        error: No weather data available for this session
                        status: failed
                      incidents:
                        error: No messages data available for this session
                        status: failed
                  summary: Unified Partial Support
          description: ''
        '400':
          description: Invalid include/session parameters
  /api/unified/races/{year}/{round_number}/incidents/:
    get:
      operationId: unified_incidents_retrieve
      description: 'Parses the session race-control messages feed and returns structured
        incident rows: lap number, message type (e.g. SAFETY_CAR, COLLISION, PENALTY),
        drivers involved, the raw message text, a timestamp in seconds, and an impact
        classification. Race-control messages are only available for seasons where
        FastF1 carries this data stream; older seasons return can_proceed=false.'
