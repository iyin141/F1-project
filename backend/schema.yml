components:
  schemas:
    Constructor:
      type: object
      properties:
        position:
          type: integer
          minimum: 1
        constructor_name:
          type: string
        points:
          type: number
          format: double
          minimum: 0
        wins:
          type: integer
          minimum: 0
      required:
      - constructor_name
      - points
      - position
      - wins
    ConstructorStandingsResponse:
      type: object
      properties:
        year:
          type: integer
          minimum: 1950
        constructors:
          type: array
          items:
            $ref: '#/components/schemas/Constructor'
        readiness:
          allOf:
          - $ref: '#/components/schemas/Readiness'
          nullable: true
      required:
      - constructors
      - year
    DRSResponse:
      type: object
      description: DRS activation response structure.
      properties:
        meta:
          $ref: '#/components/schemas/UnifiedMeta'
        filters_applied:
          $ref: '#/components/schemas/UnifiedFilters'
        data:
          type: array
          items:
            $ref: '#/components/schemas/DRSRow'
      required:
      - data
      - filters_applied
      - meta
    DRSRow:
      type: object
      description: Single DRS activation row.
      properties:
        driver_code:
          type: string
        driver_number:
          type: integer
          nullable: true
        lap_number:
          type: integer
          minimum: 1
        drs_available:
          type: boolean
        drs_activated:
          type: boolean
        gap_behind_seconds:
          type: number
          format: double
          nullable: true
        performance_delta_ms:
          type: number
          format: double
          nullable: true
