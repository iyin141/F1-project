  /api/unified/races/{year}/{round_number}/positions/:
    get:
      operationId: unified_positions_retrieve
      description: Returns a row per driver per lap showing on-track position, the
        change in position versus the previous lap, gap to the leader, and gap to
        the car directly ahead. Each row also includes stint, track status, lap time
        in seconds, and fastest-lap flags (overall and per-lap-number). Particularly
        useful for animated race-progression charts and race-pace analysis.
