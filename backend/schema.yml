          type: boolean
        description: Include team radio messages
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: 'R, Q, FP1, FP2, FP3. Default: R'
      - in: path
        name: year
        schema:
          type: integer
        required: true
