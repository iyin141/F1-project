  /api/unified/races/{year}/{round_number}/drs/:
    get:
      operationId: unified_drs_retrieve
      description: 'Returns per-driver per-lap DRS state: whether DRS was available
        on that lap (gap to the car ahead <=1 second at the detection point), whether
        it was actually activated, the gap behind in seconds, and a performance delta
        in milliseconds. Useful for visualising how much DRS influenced overtaking
        opportunities.'
