# Hand-curated circuit seed for CircuitProfile. Only fields with a source are filled; everything else is null on purpose.
# circuit_type: street = public roads closed for the event; permanent = purpose-built; hybrid = mix / semi-permanent
#   (Albert Park, Gilles Villeneuve, Sochi, Madring). Source: the circuit's Wikipedia article and formula1.com circuit page,
#   classified by the author, NOT yet verified entry by entry (verified: false). Review before trusting.
# locations: aliases matched against the stored schedule's `location` first, then its event `name` (see circuits.CircuitIndex):
#   FastF1 Location variants (accents, hyphens) and event names (e.g. "Emilia Romagna Grand Prix"). Add an alias here, plus a
#   case in tests/test_circuits.py, when the log says "UNMATCHED CIRCUIT".
# length_m / corners: NOT here, they are derived from trackmap.TrackGeometry when circuit_key is linked.
# circuit_key: the MultiViewer key (TrackGeometry.circuit_key); linked automatically (circuits.link_geometry), null until a
#   track map was built for that circuit.
# wall_proximity (0..1), overtaking_index, elevation_range_m: no source collected yet; to fill, with a citation each.
version: 2
verified: false
