          description: No response body
components:
  schemas:
    Constructor:
      type: object
      properties:
        position:
          type: integer
          minimum: 1
        constructor_name:
          type: string
        points:
          type: number
          format: double
          minimum: 0
        wins:
          type: integer
          minimum: 0
      required:
      - constructor_name
      - points
      - position
      - wins
    ConstructorStandingsResponse:
      type: object
      properties:
        year:
          type: integer
          minimum: 1950
        constructors:
          type: array
          items:
            $ref: '#/components/schemas/Constructor'
        readiness:
          allOf:
