  /api/unified/races/{year}/{round_number}/drs/:
    get:
      operationId: unified_races_drs_retrieve
      description:
        "Returns per-driver per-lap DRS state: whether DRS was available
        on that lap (gap to the car ahead <=1 second at the detection point), whether
        it was actually activated, the gap behind in seconds, and a performance delta
        in milliseconds. Useful for visualising how much DRS influenced overtaking
        opportunities."
      summary: Get DRS activation data
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code filter
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRSResponse"
          description: ""
  /api/unified/races/{year}/{round_number}/full-session/:
    get:
      operationId: unified_races_full_session_retrieve
      description:
        "Accepts a comma-separated include parameter listing any combination
        of the seven available data types: telemetry, weather, pit_stops, incidents,
        positions, drs, track_status. The session is loaded once and shared across
        all extractors, making this far more efficient than calling each dedicated
        endpoint separately. Partial results are fully supported — if one data type
        fails the others are still returned, and the top-level can_proceed flag reflects
        whether at least one type succeeded."
      summary: Get multiple data types in one request
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: Optional driver filter
        - in: query
          name: include
          schema:
            type: string
          description: "Comma-separated: telemetry,weather,pit_stops,incidents,positions,drs,track_status"
          required: true
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: R, Q, FP1, FP2, FP3
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedFullSessionResponse"
              examples:
                UnifiedPartialSupport:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      requested_types:
                        - weather
                        - incidents
                        - positions
                      cache_stats:
                        cached_sessions: 1
                        hits: 0
                        misses: 1
                        hit_rate_percent: 0.0
                      can_proceed: true
                      available_data:
                        - positions
                      unavailable_data:
                        - weather
                        - incidents
                      message:
                        "Partial support for 2016 Round 3 (R). Proceeding with:
                        ['positions']. Unavailable: ['weather', 'incidents']."
                      warnings:
                        - "Partial support for 2016 Round 3 (R). Proceeding with: ['positions'].
                          Unavailable: ['weather', 'incidents']."
                        - "weather: No weather data available for this session"
                        - "incidents: No messages data available for this session"
                    data:
                      positions:
                        meta:
                          row_count: 24
                        filters_applied:
                          driver: null
                          limit: null
                        data: []
                      weather:
                        error: No weather data available for this session
                        status: failed
                      incidents:
                        error: No messages data available for this session
                        status: failed
                  summary: Unified Partial Support
          description: ""
        "400":
          description: Invalid include/session parameters
  /api/unified/races/{year}/{round_number}/incidents/:
    get:
      operationId: unified_races_incidents_retrieve
      description:
        "Parses the session race-control messages feed and returns structured
        incident rows: lap number, message type (e.g. SAFETY_CAR, COLLISION, PENALTY),
        drivers involved, the raw message text, a timestamp in seconds, and an impact
        classification. Race-control messages are only available for seasons where
        FastF1 carries this data stream; older seasons return can_proceed=false."
      summary: Get race-control incidents
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: query
          name: radio
          schema:
            type: boolean
          description: Include team radio messages
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
          description: ""
  /api/unified/races/{year}/{round_number}/pit-stops/:
    get:
      operationId: unified_races_pit_stops_retrieve
      description:
        "Returns one row per pit stop: driver, stop number, lap in, lap
        out, stop duration in seconds, the compound fitted before and after the stop,
        and an estimated time gain/loss. Primarily meaningful for Race sessions. Use
        the driver filter to isolate one team's strategy."
      summary: Get pit stop events
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitStopResponse"
          description: ""
  /api/unified/races/{year}/{round_number}/positions/:
    get:
      operationId: unified_races_positions_retrieve
      description:
        Returns a row per driver per lap showing on-track position, the
        change in position versus the previous lap, gap to the leader, and gap to
        the car directly ahead. Use the driver filter to track a single driver's race
        journey from start to finish. Particularly useful for animated race-progression
        charts.
      summary: Get lap-by-lap position changes
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: sample_interval
          schema:
            type: integer
          description: Sample every N laps (default 5)
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
          description: ""
  /api/unified/races/{year}/{round_number}/track-status/:
    get:
      operationId: unified_races_track_status_retrieve
      description:
        Returns the sequence of official track-status changes broadcast
        during the session. Each row includes the lap number, status code (GREEN,
        YELLOW, RED, SAFETY_CAR, VSC), how many laps that status persisted, the cause
        if available, and the affected track zone. Essential context for understanding
        lap-time anomalies caused by caution periods.
      summary: Get track status timeline
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackStatusResponse"
          description: ""
  /api/unified/races/{year}/{round_number}/weather/:
    get:
      operationId: unified_races_weather_retrieve
      description:
        "Returns time-series weather snapshots captured during the session:
        track temperature, air temperature, humidity, wind speed, wind direction,
        and a rainfall flag. Pass per_lap=true to align each snapshot to the closest
        lap number instead of raw timestamps. Useful for correlating tyre degradation
        or lap-time changes with ambient conditions."
      summary: Get session weather data
      parameters:
        - in: query
          name: per_lap
          schema:
            type: boolean
          description: Align snapshots to lap numbers
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - unified
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
          description: ""
