                        points: 25.0
                    readiness:
                      can_proceed: true
                      available_data:
                      - race_results_persisted
                      unavailable_data:
                      - qualifying_results
                      message: Some requested datasets are unavailable for 2020 Round
                        2.
                      warnings:
                      - Some requested datasets are unavailable for 2020 Round 2.
                  summary: Race Results Partial Proceed
          description: ''
        '400':
          description: Invalid route parameters
  /api/schema/:
