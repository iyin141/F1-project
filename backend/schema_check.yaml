        required: true
      - in: query
        name: limit_points
        schema:
          type: integer
        description: Maximum telemetry points
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: sector_end
        schema:
          type: integer
        description: Sector window end (1-3)
      - in: query
        name: sector_start
        schema:
          type: integer
        description: Sector window start (1-3)
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: query
        name: stride
