        required: true
      - in: query
        name: lap_a
        schema:
          type: integer
        description: Lap number for driver_a
      - in: query
        name: lap_b
        schema:
          type: integer
        description: Lap number for driver_b
      - in: query
        name: limit_points
        schema:
          type: integer
        description: Maximum telemetry points per trace
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: sector_end
        schema:
          type: integer
        description: Sector window end (1-3)
      - in: query
        name: sector_start
        schema:
          type: integer
        description: Sector window start (1-3)
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: query
        name: stride
        schema:
          type: integer
        description: Sample every N points
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
