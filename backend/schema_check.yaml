        description: FP1, FP2, or FP3
        required: true
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - races
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                PracticeUnsupportedSession:
                  value:
                    year: 2016
                    round: 3
                    session: FP1
                    practice: []
                    readiness:
                      can_proceed: false
                      available_data: []
                      unavailable_data:
                      - practice_results
                      message: 'Session loaded, but required data is unavailable for
                        2016 Round 3 (FP1). Missing: practice_results.'
                      warnings:
                      - 'Session loaded, but required data is unavailable for 2016
                        Round 3 (FP1). Missing: practice_results.'
