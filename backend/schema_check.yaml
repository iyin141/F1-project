openapi: 3.0.3
info:
  title: F1 Stats Dashboard API
  version: 1.0.0
  description: OpenAPI schema for F1 analytics, unified FastF1 data, and persistence
    coverage endpoints.
paths:
  /api/analysis/races/{year}/{round_number}/laps/:
    get:
      operationId: analysis_races_laps_retrieve
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: 3-letter driver code
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum rows to return
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapAnalysisResponse'
              examples:
                ReadinessProceed:
                  value:
                    meta:
                      year: 2020
                      round: 2
                      session: R
                      row_count: 5
                      limit_max: 2000
                      can_proceed: true
                      available_data:
                      - laps
                      - track_status
                      unavailable_data: []
                      message: null
                      warnings: []
                    filters_applied:
                      driver: null
                      limit: 5
                    data:
                    - driver_code: VER
                      lap_number: 1
                      lap_time: 0 days 00:01:37.123000
                      sector1: 0 days 00:00:31.100000
                      sector2: 0 days 00:00:33.000000
                      sector3: 0 days 00:00:33.023000
                      compound: MEDIUM
                      stint: 1
                      is_personal_best: false
                  summary: Readiness Proceed
                ReadinessPartialUnsupported:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      row_count: 0
                      limit_max: 2000
                      can_proceed: false
                      available_data:
                      - track_status
                      unavailable_data:
                      - laps
                      message: 'Session loaded, but required data is unavailable for
                        2016 Round 3 (R). Missing: laps.'
                      warnings:
                      - 'Session loaded, but required data is unavailable for 2016
                        Round 3 (R). Missing: laps.'
                    filters_applied:
                      driver: null
                      limit: 5
                    data: []
                  summary: Readiness Partial Unsupported
          description: ''
        '400':
          description: Invalid query parameters
  /api/analysis/races/{year}/{round_number}/pace/:
    get:
      operationId: analysis_races_pace_retrieve
      parameters:
      - in: path
