  /api/unified/races/{year}/{round_number}/drs/:
    get:
      operationId: unified_races_drs_retrieve
      description: Extract DRS activation data.
      parameters:
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - unified
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/unified/races/{year}/{round_number}/full-session/:
    get:
      operationId: unified_races_full_session_retrieve
      description: Query multiple data types from a session simultaneously.
      parameters:
      - in: query
        name: driver
        schema:
          type: string
        description: Optional driver filter
      - in: query
        name: include
        schema:
          type: string
        description: 'Comma-separated: telemetry,weather,pit_stops,incidents,positions,drs,track_status'
        required: true
      - in: path
        name: round_number
        schema:
          type: integer
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: R, Q, FP1, FP2, FP3
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - unified
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedFullSessionResponse'
              examples:
                UnifiedPartialSupport:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      requested_types:
                      - weather
                      - incidents
                      - positions
                      cache_stats:
                        cached_sessions: 1
                        hits: 0
                        misses: 1
                        hit_rate_percent: 0.0
                      can_proceed: true
                      available_data:
                      - positions
                      unavailable_data:
                      - weather
                      - incidents
                      message: 'Partial support for 2016 Round 3 (R). Proceeding with:
                        [''positions'']. Unavailable: [''weather'', ''incidents''].'
                      warnings:
                      - 'Partial support for 2016 Round 3 (R). Proceeding with: [''positions''].
                        Unavailable: [''weather'', ''incidents''].'
                      - 'weather: No weather data available for this session'
                      - 'incidents: No messages data available for this session'
                    data:
                      positions:
                        meta:
                          row_count: 24
                        filters_applied:
                          driver: null
                          limit: null
                        data: []
                      weather:
                        error: No weather data available for this session
                        status: failed
                      incidents:
                        error: No messages data available for this session
                        status: failed
                  summary: Unified Partial Support
          description: ''
        '400':
          description: Invalid include/session parameters
  /api/unified/races/{year}/{round_number}/incidents/:
