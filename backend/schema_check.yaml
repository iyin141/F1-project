openapi: 3.0.3
info:
  title: F1 Stats Dashboard API
  version: 1.0.0
  description:
    OpenAPI schema for F1 analytics, unified FastF1 data, and persistence
    coverage endpoints.
paths:
  /api/analysis/races/{year}/{round_number}/laps/:
    get:
      operationId: analysis_races_laps_retrieve
      description:
        Returns one row per valid lap containing the driver, lap number,
        total lap time, all three sector times, tyre compound, stint number, and a
        personal-best flag. Laps with no recorded LapTime are excluded. Supports all
        five session types (R, Q, FP1-FP3). Use the driver filter to narrow to one
        driver and limit to cap the result set.
      summary: Get lap-by-lap analysis
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: R, Q, FP1, FP2, FP3
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapAnalysisResponse"
              examples:
                ReadinessProceed:
                  value:
                    meta:
                      year: 2020
                      round: 2
                      session: R
                      row_count: 5
                      limit_max: 2000
                      can_proceed: true
                      available_data:
                        - laps
                        - track_status
                      unavailable_data: []
                      message: null
                      warnings: []
                    filters_applied:
                      driver: null
                      limit: 5
                    data:
                      - driver_code: VER
                        lap_number: 1
                        lap_time: 0 days 00:01:37.123000
                        sector1: 0 days 00:00:31.100000
                        sector2: 0 days 00:00:33.000000
                        sector3: 0 days 00:00:33.023000
                        compound: MEDIUM
                        stint: 1
                        is_personal_best: false
                  summary: Readiness Proceed
                ReadinessPartialUnsupported:
                  value:
                    meta:
                      year: 2016
                      round: 3
                      session: R
                      row_count: 0
                      limit_max: 2000
                      can_proceed: false
                      available_data:
                        - track_status
                      unavailable_data:
                        - laps
                      message:
                        "Session loaded, but required data is unavailable for
                        2016 Round 3 (R). Missing: laps."
                      warnings:
                        - "Session loaded, but required data is unavailable for 2016
                          Round 3 (R). Missing: laps."
                    filters_applied:
                      driver: null
                      limit: 5
                    data: []
                  summary: Readiness Partial Unsupported
          description: ""
        "400":
          description: Invalid query parameters
  /api/analysis/races/{year}/{round_number}/pace/:
    get:
      operationId: analysis_races_pace_retrieve
      description:
        Aggregates lap times per driver to expose median pace, best lap,
        and consistency (standard deviation). For Race sessions the service reads
        pre-computed DriverMetric rows from the database before falling back to a
        live FastF1 computation, making it fast for recently populated seasons. Ideal
        for building a pace-comparison chart across the entire grid.
      summary: Get driver pace analysis
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code filter
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaceAnalysisResponse"
          description: ""
        "400":
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/sector-analysis/:
    get:
      operationId: analysis_races_sector_analysis_retrieve
      description:
        For each driver returns best and median times for Sectors 1, 2,
        and 3, alongside their best actual lap and the theoretical best lap (sum of
        each sector's individual best). The delta between actual best and theoretical
        best shows how close a driver came to perfecting their lap. Race-session results
        are served from persisted SectorAggregate rows when available.
      summary: Get sector-time analysis
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code filter
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorAnalysisResponse"
          description: ""
        "400":
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/stints/:
    get:
      operationId: analysis_races_stints_retrieve
      description:
        "Groups consecutive laps on the same tyre compound into stints
        and returns per-stint statistics: compound name, start/end lap, and median/min/max
        lap time. For Race sessions the service reads pre-computed StintData rows
        from the database, bypassing a live FastF1 call entirely. Useful for visualising
        tyre degradation and strategy comparison across drivers."
      summary: Get stint-level analysis
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code filter
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StintAnalysisResponse"
          description: ""
        "400":
          description: Invalid parameters
  /api/analysis/races/{year}/{round_number}/telemetry/:
    get:
      operationId: analysis_races_telemetry_retrieve
      description:
        "Streams car-data samples for one specific lap of one driver: speed
        (kph), throttle percentage, brake state, RPM, gear, and distance along the
        lap. Both driver and lap are required. Use limit_points and stride to downsample
        large payloads for charting, and sector_start / sector_end to zoom into a
        specific sector window (1-3) of the lap."
      summary: Get single-lap car telemetry
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code
          required: true
        - in: query
          name: lap
          schema:
            type: integer
          description: Lap number
          required: true
        - in: query
          name: limit_points
          schema:
            type: integer
          description: Maximum telemetry points
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: sector_end
          schema:
            type: integer
          description: Sector window end (1-3)
        - in: query
          name: sector_start
          schema:
            type: integer
          description: Sector window start (1-3)
        - in: query
          name: session
          schema:
            type: string
          description: R, Q, FP1, FP2, FP3
        - in: query
          name: stride
          schema:
            type: integer
          description: Sample every N points
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAnalysisResponse"
          description: ""
        "400":
          description: Missing or invalid telemetry query parameters
  /api/analysis/races/{year}/{round_number}/telemetry/overlay/:
    get:
      operationId: analysis_races_telemetry_overlay_retrieve
      description:
        Loads telemetry for driver_a and driver_b and returns separate
        traces aligned by distance so the frontend can render an overlay chart. Both
        driver codes are required; laps default to each driver's fastest lap when
        omitted. Sector windowing and downsampling work the same as the single-driver
        telemetry endpoint.
      summary: Compare telemetry of two drivers
      parameters:
        - in: query
          name: driver_a
          schema:
            type: string
          description: First 3-letter driver code
          required: true
        - in: query
          name: driver_b
          schema:
            type: string
          description: Second 3-letter driver code
          required: true
        - in: query
          name: lap_a
          schema:
            type: integer
          description: Lap number for driver_a
        - in: query
          name: lap_b
          schema:
            type: integer
          description: Lap number for driver_b
        - in: query
          name: limit_points
          schema:
            type: integer
          description: Maximum telemetry points per trace
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: sector_end
          schema:
            type: integer
          description: Sector window end (1-3)
        - in: query
          name: sector_start
          schema:
            type: integer
          description: Sector window start (1-3)
        - in: query
          name: session
          schema:
            type: string
          description: R, Q, FP1, FP2, FP3
        - in: query
          name: stride
          schema:
            type: integer
          description: Sample every N points
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryOverlayResponse"
          description: ""
        "400":
          description: Missing or invalid telemetry overlay query parameters
  /api/analysis/races/{year}/{round_number}/telemetry/summary/:
    get:
      operationId: analysis_races_telemetry_summary_retrieve
      description:
        "Returns high-level statistics computed from the telemetry of a
        single specified lap: maximum speed, number of braking zones detected, percentage
        of the lap spent on full throttle, and total sample count. Both driver and
        lap are required. Use sector_start / sector_end to restrict the summary to
        one part of the track."
      summary: Get telemetry summary for a lap
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code
          required: true
        - in: query
          name: lap
          schema:
            type: integer
          description: Lap number
          required: true
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: sector_end
          schema:
            type: integer
          description: Sector window end (1-3)
        - in: query
          name: sector_start
          schema:
            type: integer
          description: Sector window start (1-3)
        - in: query
          name: session
          schema:
            type: string
          description: R, Q, FP1, FP2, FP3
        - in: query
          name: stride
          schema:
            type: integer
          description: Sample every N points
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySummaryResponse"
          description: ""
        "400":
          description: Missing or invalid telemetry summary query parameters
  /api/analysis/races/{year}/{round_number}/tyre-strategy/:
    get:
      operationId: analysis_races_tyre_strategy_retrieve
      description:
        "Extends the stint view with tyre-strategy-specific fields: average
        lap time per stint, median lap time, and per-lap degradation in seconds. Sourced
        from persisted StintData for Race sessions and computed live from FastF1 otherwise.
        Ideal for building tyre-strategy timeline charts that show compound changes
        and pace impact across the race."
      summary: Get tyre strategy analysis
      parameters:
        - in: query
          name: driver
          schema:
            type: string
          description: 3-letter driver code filter
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum rows to return
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: query
          name: session
          schema:
            type: string
          description: "R, Q, FP1, FP2, FP3. Default: R"
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - analysis
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyreStrategyResponse"
          description: ""
        "400":
          description: Invalid parameters
  /api/constructors/{year}/:
    get:
      operationId: constructors_retrieve
      description:
        Same dual-source strategy as driver standings but aggregated at
        the constructor (team) level. Returns each team's total points and wins for
        the season. Useful for building a Constructors' Championship table or a team-comparison
        view.
      summary: Get constructor championship standings
      parameters:
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - constructors
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructorStandingsResponse"
              examples:
                ConstructorStandingsReadiness:
                  value:
                    year: 2021
                    constructors:
                      - position: 1
                        constructor_name: Mercedes
                        points: 613.5
                        wins: 9
                    readiness:
                      can_proceed: true
                      available_data:
                        - constructor_standings_api
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Constructor Standings Readiness
          description: ""
  /api/drivers/{driver_code}/{year}/:
    get:
      operationId: drivers_retrieve
      description:
        "Returns race-by-race results for one driver in a specific season:
        grid position, finish position, points, fastest lap flag, and qualifying time.
        The service queries persisted RaceResult rows first; for any missing rounds
        it fetches from FastF1. Also includes the driver's final championship position
        and points for the season."
      summary: Get driver season breakdown
      parameters:
        - in: path
          name: driver_code
          schema:
            type: string
          description: 3-letter driver code (e.g. VER, HAM, LEC)
          required: true
        - in: path
          name: year
          schema:
            type: integer
          description: Season year (1950 onwards)
          required: true
      tags:
        - drivers
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverSeasonResponse"
          description: ""
        "400":
          description: Invalid parameters
        "404":
          description: Season not found
  /api/drivers/{driver_code}/career/:
    get:
      operationId: drivers_career_retrieve
      description:
        "Returns a complete career summary for a driver: all seasons with
        position, points, wins, podiums, poles, fastest laps, and DNFs. The service
        checks persisted DriverSeasonSummary rows first; for any missing seasons it
        queries Jolpica driverStandings endpoint. Returns 'no career data available'
        when neither source has data for this driver code."
      summary: Get driver career history
      parameters:
        - in: path
          name: driver_code
          schema:
            type: string
          description: 3-letter driver code (e.g. VER, HAM, LEC)
          required: true
      tags:
        - drivers
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverCareerResponse"
          description: ""
        "400":
          description: Invalid driver code
  /api/drivers/{year}/:
    get:
      operationId: drivers_retrieve_2
      description:
        Queries the Ergast / Jolpica F1 standings API for the requested
        year and returns every driver's cumulative championship position, points tally,
        and win count. Two API URLs are tried in sequence so the service degrades
        gracefully if the primary source is down. When neither source responds the
        response still returns HTTP 200 with can_proceed=false and a human-readable
        message.
      summary: Get driver championship standings
      parameters:
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - drivers
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverStandingsResponse"
              examples:
                DriverStandingsReadiness:
                  value:
                    year: 2021
                    drivers:
                      - position: 1
                        driver_name: Max Verstappen
                        points: 395.5
                        wins: 10
                        constructor: Red Bull
                    readiness:
                      can_proceed: true
                      available_data:
                        - driver_standings_api
                      unavailable_data: []
                      message: null
                      warnings: []
                  summary: Driver Standings Readiness
          description: ""
  /api/races/{year}/:
    get:
      operationId: races_retrieve
      description:
        Returns the full calendar for a given F1 season as an ordered list
        of races. The service checks the local database first (for seasons that have
        been persisted) and falls back to a live FastF1 API call if no stored data
        is found. The round numbers in the response are the identifiers used by every
        other endpoint.
      summary: Get season race schedule
      parameters:
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - races
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ""
  /api/races/{year}/{round_number}/:
    get:
      operationId: races_retrieve_2
      description:
        Returns name, date, location, and country for one race identified
        by season year and round number. Checks persisted DB data first; falls back
        to the live FastF1 schedule if the race has not been populated yet. Returns
        404 when neither source can resolve the requested round.
      summary: Get single race detail
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - races
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ""
        "404":
          description: Race not found
  /api/races/{year}/{round_number}/practice/{session_name}/:
    get:
      operationId: races_practice_retrieve
      description:
        Returns the fastest-lap leaderboard for FP1, FP2, or FP3. The service
        prioritises lap-time data from the loaded session; if lap data is unavailable
        it falls back to the session results table (which carries best-lap information
        for older seasons). Passing an invalid session name such as FP4 returns a
        400 immediately.
      summary: Get practice session fastest laps
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: path
          name: session_name
          schema:
            type: string
          description: FP1, FP2, or FP3
          required: true
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - races
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                PracticeUnsupportedSession:
                  value:
                    year: 2016
                    round: 3
                    session: FP1
                    practice: []
                    readiness:
                      can_proceed: false
                      available_data: []
                      unavailable_data:
                        - practice_results
                      message:
                        "Session loaded, but required data is unavailable for
                        2016 Round 3 (FP1). Missing: practice_results."
                      warnings:
                        - "Session loaded, but required data is unavailable for 2016
                          Round 3 (FP1). Missing: practice_results."
                  summary: Practice Unsupported Session
          description: ""
        "400":
          description: Invalid route parameters
  /api/races/{year}/{round_number}/qualifying/:
    get:
      operationId: races_qualifying_retrieve
      description:
        Loads the Qualifying session via FastF1 and returns each driver's
        Q1, Q2, and Q3 times along with their final grid position. For seasons or
        rounds where FastF1 does not carry qualifying data (e.g. very old seasons),
        can_proceed will be false and the data array will be empty rather than raising
        an error.
      summary: Get qualifying results only
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - races
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                QualifyingUnsupportedSession:
                  value:
                    year: 2016
                    round: 3
                    qualifying: []
                    readiness:
                      can_proceed: false
                      available_data: []
                      unavailable_data:
                        - qualifying_results
                      message:
                        "Session loaded, but required data is unavailable for
                        2016 Round 3 (Q). Missing: qualifying_results."
                      warnings:
                        - "Session loaded, but required data is unavailable for 2016
                          Round 3 (Q). Missing: qualifying_results."
                  summary: Qualifying Unsupported Session
          description: ""
        "400":
          description: Invalid route parameters
  /api/races/{year}/{round_number}/results/:
    get:
      operationId: races_results_retrieve
      description:
        Returns a combined payload with a qualifying array and a race array
        for the requested round. Race rows are served from the database when the round
        has been persisted; otherwise they are fetched live from FastF1. Qualifying
        results are always fetched live from the FastF1 Qualifying session. The readiness
        object reflects whether one or both sub-datasets are available so the frontend
        can render partial results gracefully.
      summary: Get qualifying and race results
      parameters:
        - in: path
          name: round_number
          schema:
            type: integer
          required: true
        - in: path
          name: year
          schema:
            type: integer
          required: true
      tags:
        - races
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                RaceResultsPartialProceed:
                  value:
                    year: 2020
                    round: 2
                    results:
                      qualifying: []
                      race:
                        - position: 1
                          driver_name: Lewis Hamilton
                          constructor: Mercedes
                          grid: 1
                          laps: 71
                          status: Finished
                          time: "1:22:50.683"
                          points: 25.0
                    readiness:
                      can_proceed: true
                      available_data:
                        - race_results_persisted
                      unavailable_data:
                        - qualifying_results
                      message:
                        Some requested datasets are unavailable for 2020 Round
                        2.
                      warnings:
                        - Some requested datasets are unavailable for 2020 Round 2.
                  summary: Race Results Partial Proceed
          description: ""
        "400":
          description: Invalid route parameters
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - yaml
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - af
              - ar
              - ar-dz
              - ast
              - az
              - be
              - bg
              - bn
              - br
              - bs
              - ca
              - ckb
              - cs
              - cy
              - da
              - de
              - dsb
              - el
              - en
              - en-au
              - en-gb
              - eo
