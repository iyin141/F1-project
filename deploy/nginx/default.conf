# nginx in front of the F1 Control Room containers.
# TLS: terminate here (certbot / existing certs) or at an upstream load balancer.

upstream api_upstream    { server web:8000; keepalive 32; }
upstream flower_upstream { server flower:5555; }
upstream frontend_upstream { server frontend:3000; }

# The frontend calls its OWN /api/... (Next.js route handlers) and its server adds INTERNAL_API_KEY before forwarding to Django, so the
# key never reaches the browser. Browsers mark those calls `Sec-Fetch-Site: same-origin`; they go to the frontend. Every other caller
# (API clients with their own X-API-Key, curl, the Python client, MCP) keeps going straight to Django, exactly as before.
map $http_sec_fetch_site $api_target {
    default      api_upstream;
    same-origin  frontend_upstream;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # API, including SSE task streams: no buffering so events flush immediately.
    # Django's own pages stay on Django even when a browser reaches them from a link on the site.
    location ~ ^/api/(docs|schema|redoc)(/|$) {
        proxy_pass http://api_upstream;
    }

    location /api/ {
        proxy_pass http://$api_target;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # Flower is admin-only: basic auth (create deploy/nginx/.htpasswd with `htpasswd -c`).
    location /flower/ {
        auth_basic "Flower";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://flower_upstream;
    }

    # Django admin and its static assets (whitenoise serves /static/) stay on the API.
    location /admin/ {
        proxy_pass http://api_upstream;
    }

    location /static/ {
        proxy_pass http://api_upstream;
    }

    # Everything else is the Next.js frontend (its own /_next/ assets included).
    location / {
        proxy_pass http://frontend_upstream;
    }
}
