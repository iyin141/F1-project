# F1 Control Room: production stack (Oracle A1 Flex, 4 ARM cores, 24 GB RAM).
# Postgres runs in the stack (pgvector image, internal network, named volume). Set POSTGRES_PASSWORD in .env.
# The dev overlay (docker-compose.dev.yml) only publishes its port and adds hot reload.
#
#   cp .env.example .env   # fill in secrets
#   make build && make up
#
# Memory limits follow the budget in backend/start_prod.sh (~4.5 GB for the app tier),
# plus the new ML/RAG workers. Total limits stay well under 24 GB.

# One DATABASE_URL for every app service (credentials from .env); services that redefine
# `environment:` repeat it with *database-url.
x-database-url: &database-url postgres://${POSTGRES_USER:-f1}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-f1}

x-backend: &backend
  image: f1-control-room-api:latest
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  init: true   # tini-equivalent PID 1: reaps celery/uvicorn children, forwards signals
  environment:
    DATABASE_URL: *database-url
    FASTF1_AUTH: ${FASTF1_AUTH:-none}   # none | token (F1TV login; see docs/v2/VM_RUNBOOK.md)
    XDG_DATA_HOME: /fastf1-auth         # FastF1 keeps its token in <this>/fastf1/ (volume fastf1_auth)
    REDIS_1_URL: redis://redis-cache:6379/1
    REDIS_2_URL: redis://redis-telemetry:6379/2
    REDIS_3_URL: redis://redis-broker:6379/0
    REDIS_4_URL: redis://redis-ratelimit:6379/3
  volumes:
    - f1_cache:/app/f1_cache
    - app_logs:/app/logs
    - fastf1_auth:/fastf1-auth
  depends_on:
    postgres: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    redis-telemetry: { condition: service_healthy }
    redis-broker: { condition: service_healthy }
    redis-ratelimit: { condition: service_healthy }
  restart: unless-stopped

x-redis: &redis
  image: redis:7-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 3s
    retries: 5
  restart: unless-stopped

x-worker: &worker
  <<: *backend
  healthcheck:
    test: ["CMD-SHELL", "celery -A f1_project inspect ping -d $${CELERY_WORKER_NAME}@$$HOSTNAME --timeout 10 > /dev/null || exit 1"]
    interval: 60s
    timeout: 20s
    retries: 3
    start_period: 60s

services:
  web:
    <<: *backend
    # Plain API image: no torch, no onnxruntime/fastembed, no claude CLI (retrieval runs on worker-rag).
    environment:
      DATABASE_URL: *database-url
      FASTF1_AUTH: ${FASTF1_AUTH:-none}          # none | token (F1TV login; see docs/v2/VM_RUNBOOK.md)
      XDG_DATA_HOME: /fastf1-auth                # FastF1 keeps its token in <this>/fastf1/ (volume fastf1_auth)
      RUN_COLLECTSTATIC: "1"
      REDIS_1_URL: redis://redis-cache:6379/1
      REDIS_2_URL: redis://redis-telemetry:6379/2
      REDIS_3_URL: redis://redis-broker:6379/0
      REDIS_4_URL: redis://redis-ratelimit:6379/3
      RUN_MIGRATIONS: "1"
    command: ["uvicorn", "f1_project.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--log-level", "info"]
    expose: ["8000"]
    deploy:
      resources:
        limits: { memory: 768m }

  worker-t1:
    <<: *worker
    environment: &w-env-t1
      DATABASE_URL: *database-url
      FASTF1_AUTH: ${FASTF1_AUTH:-none}          # none | token (F1TV login; see docs/v2/VM_RUNBOOK.md)
      XDG_DATA_HOME: /fastf1-auth                # FastF1 keeps its token in <this>/fastf1/ (volume fastf1_auth)
      REDIS_1_URL: redis://redis-cache:6379/1
      REDIS_2_URL: redis://redis-telemetry:6379/2
      REDIS_3_URL: redis://redis-broker:6379/0
      REDIS_4_URL: redis://redis-ratelimit:6379/3
      CELERY_WORKER_NAME: worker_tier1
    command: celery -A f1_project worker -Q tier1_instant -c 4 --pool=prefork -n worker_tier1@%h --loglevel=info
    deploy: { resources: { limits: { memory: 768m } } }   # measured idle 455 MiB: 512m was OOM-prone

  worker-t2:
    <<: *worker
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_tier2
    command: celery -A f1_project worker -Q tier2_fast -c 4 --pool=prefork -n worker_tier2@%h --loglevel=info
    deploy: { resources: { limits: { memory: 1g } } }

  worker-t3:
    <<: *worker
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_tier3
      CHAOS_FEATURES_DIR: /features
    volumes:
      - f1_cache:/app/f1_cache
      - app_logs:/app/logs
      - ml_features:/features
      - fastf1_auth:/fastf1-auth
    command: celery -A f1_project worker -Q tier3_medium -c 4 --pool=prefork --max-memory-per-child=128000 -n worker_tier3@%h --loglevel=info
    deploy: { resources: { limits: { memory: 768m } } }

  worker-t4:
    <<: *worker
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_tier4
    command: celery -A f1_project worker -Q tier4_telemetry -c 3 --pool=prefork --max-memory-per-child=375000 -n worker_tier4@%h --loglevel=info
    deploy: { resources: { limits: { memory: 1536m } } }

  # tier5_pagination and backfill are declared in f1_project/celery.py but had no
  # consumer in start_prod.sh, so tasks routed there never ran. This worker fixes that.
  worker-t5:
    <<: *worker
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_tier5
    command: celery -A f1_project worker -Q tier5_pagination,backfill -c 2 --pool=prefork -n worker_tier5@%h --loglevel=info
    deploy: { resources: { limits: { memory: 512m } } }

  worker-t6:
    <<: *worker
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_tier6
    command: celery -A f1_project worker -Q tier6_notifications -c 2 --pool=prefork -n worker_tier6@%h --loglevel=info
    deploy: { resources: { limits: { memory: 256m } } }

  # Phase 2 (Chaos Point). Enable with: docker compose --profile ml up -d
  worker-ml:
    <<: *worker
    image: f1-control-room-ml:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
      args:
        BASE_IMAGE: f1-control-room-api:latest
    profiles: ["ml"]
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_ml
      CHAOS_FEATURES_DIR: /features
    command: celery -A f1_project worker -Q ml -c 1 -n worker_ml@%h --loglevel=info
    volumes:
      - f1_cache:/app/f1_cache
      - app_logs:/app/logs
      - ml_models:/models
      - ml_features:/features
    deploy: { resources: { limits: { memory: 4g } } }

  # Stewards ingestion and retrieval (A3). Same image as the API; no torch.
  worker-rag:
    <<: *worker
    image: f1-control-room-rag:latest   # API image + fastembed/onnxruntime + claude CLI
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { INSTALL_CLAUDE_CLI: "1", INSTALL_RAG: "1" }
    volumes:
      - f1_cache:/app/f1_cache
      - app_logs:/app/logs
      - stewards_models:/stewards/models   # Hugging Face download cache (slow, flaky: keep it)
      - stewards_data:/stewards/data       # FIA PDFs: private volume, never served by nginx
      - ${CLAUDE_CONFIG_DIR:?set CLAUDE_CONFIG_DIR in .env (host ~/.claude, owned by uid 1000)}:/home/app/.claude
    environment:
      <<: *w-env-t1
      CELERY_WORKER_NAME: worker_rag
      STEWARDS_MODEL_CACHE: /stewards/models
      STEWARDS_DATA_DIR: /stewards/data
      # .env sets CLAUDE_CONFIG_DIR to the HOST folder (it feeds the bind mount above). Without this line the CLI inherits that host path,
      # looks for the login there, finds nothing in the container and reports "Not logged in". Inside the container the login is at /home/app/.claude.
      CLAUDE_CONFIG_DIR: /home/app/.claude
      HF_HUB_OFFLINE: "1"   # models come from the seeded volume; see docs/v2/progress/A0-infra.md
    command: celery -A f1_project worker -Q rag -c 2 --pool=prefork -n worker_rag@%h --loglevel=info
    deploy: { resources: { limits: { memory: 1g } } }

  beat:
    <<: *backend
    command: celery -A f1_project beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:   # the image HEALTHCHECK probes uvicorn; beat has no HTTP port
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* > /dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy: { resources: { limits: { memory: 256m } } }

  flower:
    <<: *backend
    command: celery -A f1_project flower --port=5555 --url_prefix=flower
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5555/flower/healthcheck', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose: ["5555"]
    deploy: { resources: { limits: { memory: 256m } } }

  # Production database: lives inside the stack (no Neon). Internal network only, NO host port.
  # Image pinned by tag; multi-arch (linux/amd64 + linux/arm64) verified with
  # `docker buildx imagetools inspect pgvector/pgvector:0.8.0-pg17`. The assistant migration
  # creates the `vector` extension; pg_trgm ships in the image.
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1}
      POSTGRES_USER: ${POSTGRES_USER:-f1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=384MB", "-c", "effective_cache_size=1GB", "-c", "max_connections=150", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=128MB"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536m } } }

  # Scheduled pg_dump (custom format, compressed) to the pg_backups volume, with retention.
  # `make backup` runs one now; `make restore f=<file>` restores; see deploy/backup/.
  pgbackup:
    image: pgvector/pgvector:0.8.0-pg17
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-f1}
      PGDATABASE: ${POSTGRES_DB:-f1}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
    volumes:
      - pg_backups:/backups
      - ./deploy/backup:/scripts:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  # Four Redis servers, matching the eviction policies required in f1_project/settings.py.
  redis-cache:        # REDIS_1: app cache
    <<: *redis
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy: { resources: { limits: { memory: 1152m } } }
  redis-telemetry:    # REDIS_2: telemetry cache
    <<: *redis
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy: { resources: { limits: { memory: 256m } } }
  redis-broker:       # REDIS_3: Celery broker + results, must never evict
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [ "redis_broker:/data" ]
    deploy: { resources: { limits: { memory: 256m } } }
  redis-ratelimit:    # REDIS_4: rate limiting
    <<: *redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", ""]
    deploy: { resources: { limits: { memory: 96m } } }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Must exist before `up` (else Docker creates a directory): htpasswd -c deploy/nginx/.htpasswd admin
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - web
      - flower
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128m } } }

  # Frontend (Next.js). The image is built from the frontend repo's Dockerfile with
  # NEXT_PUBLIC_API_MODE=live and an empty NEXT_PUBLIC_API_BASE_URL, so the browser calls
  # the same origin (nginx routes /api/ to web). No build section here, no host port.
  frontend:
    image: f1-control-room-frontend:latest
    expose: ["3000"]
    environment:
      # server-only (never baked into the image): where the Next route handlers forward, and the key they add for the browser
      BACKEND_URL: http://web:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

volumes:
  fastf1_auth:
  pg_data:
  pg_backups:
  stewards_models:
  stewards_data:
  f1_cache:
  app_logs:
  redis_broker:
  ml_models:
  ml_features:
