# Local development overlay: publishes postgres on loopback, source mounted for hot reload, DEBUG on.
# source mounted for hot reload, DEBUG on.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]   # production publishes no port; dev only, loopback

  web:
    environment:
      DEBUG: "True"
      RUN_MIGRATIONS: "1"
    command: ["uvicorn", "f1_project.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - f1_cache:/app/f1_cache
    ports: ["8000:8000"]

